# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.
# Project
version=1.0.0
group=wtf.vd
java_version=21
common_java_version=21
forge_java_version=17
neoforge_java_version=21
# Common
minecraft_version=1.21.1
mod_name=Multi Item Frame
mod_author=Vee Dee
mod_id=multiitemframe
archives_name=multiitemframe
license=LGPL-3.0
credits=
description=Adds multi-slot Item Frames that can show items placed from the inventory or JEI, with optional highlight coloring and AE2/Mekanism settings copy support.
minecraft_version_range=[1.21.1, 1.22)
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.07.07
# Fabric is not a supported loader for this project; these are unused placeholders required only
# because buildSrc's shared multiloader-common.gradle (reused verbatim from
# AE2-Improved-Crafting-Prioritization) always expands them into resource templates.
fabric_version=
fabric_loader_version=
# Forge
forge_version=47.4.10
forge_loader_version_range=[47,)
# NeoForge
neoforge_version=21.1.244
neoforge_loader_version_range=[4,)
# Optional dependencies (Ch.5): AE2 memory card / Mekanism configuration card / JEI integration.
# Same version pins as the Mekanism-Factory-Information reference project where the same MC version applies.
ae2_version_forge=7KVs6HMQ
ae2_version_neoforge=19.2.17
mekanism_version_forge=1.20.1-10.4.16.80
mekanism_version_neoforge=1.21.1-10.7.19.85
jei_version_forge=15.20.0.108
jei_version_neoforge=19.19.3.224
# Jade (Ch.5/7 - entity tooltip content display). Modrinth version IDs (not version numbers, same
# convention as ae2_version_forge above) - Jade's version_number strings contain a "+" that isn't a
# safe Gradle/Maven version coordinate.
jade_version_forge=xJQHCmWJ
jade_version_neoforge=eYz2YBGT
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
